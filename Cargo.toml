[workspace]
members = ["crates/photon-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "2.17.0"
edition = "2021"
license = "MIT"
authors = ["Photon IDE"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
ignore = "0.4"
tree-sitter = "0.23"
tree-sitter-php = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
