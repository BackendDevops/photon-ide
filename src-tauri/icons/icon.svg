<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#283047"/><stop offset="0.45" stop-color="#171d2c"/><stop offset="1" stop-color="#0a0e18"/>
  </linearGradient>
  <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/><stop offset="0.13" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="brk" x1="0" y1="0.1" x2="1" y2="1">
   <stop offset="0" stop-color="#9a7bff"/><stop offset="1" stop-color="#5b86ff"/>
  </linearGradient>
  <linearGradient id="swirl" x1="1" y1="0" x2="0.15" y2="1">
   <stop offset="0" stop-color="#ffaf3c"/><stop offset="0.24" stop-color="#ff7e30"/>
   <stop offset="0.5" stop-color="#ff5436"/><stop offset="0.76" stop-color="#b146e8"/>
   <stop offset="1" stop-color="#6b39e0"/>
  </linearGradient>
  <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
   <stop offset="0" stop-color="#ffffff"/><stop offset="0.34" stop-color="#ffdca6"/>
   <stop offset="0.72" stop-color="#ff7330"/><stop offset="1" stop-color="#ff5a2c" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bglow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/></filter>
  <clipPath id="r"><rect x="64" y="64" width="896" height="896" rx="208" ry="208"/></clipPath>
 </defs>

 <g filter="url(#sh)"><rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#panel)"/></g>
 <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#bevel)"/>
 <rect x="65.5" y="65.5" width="893" height="893" rx="206" ry="206" fill="none" stroke="#9fb0d8" stroke-opacity="0.16" stroke-width="3"/>

 <g clip-path="url(#r)">
  <!-- glow inside the bowl counter -->
  <circle cx="566" cy="406" r="140" fill="#ff5a2c" opacity="0.20" filter="url(#bglow)"/>

  <!-- P stem (clear vertical bar) -->
  <rect x="402" y="318" width="62" height="396" rx="31" fill="url(#swirl)"/>
  <!-- pointed comet tail under the stem foot -->
  <path d="M 412 700 L 454 700 L 433 794 Z" fill="#6b39e0"/>

  <!-- burst sits in the counter, framed by the bowl ring -->
  <circle cx="566" cy="406" r="80" fill="url(#burst)" filter="url(#bglow)"/>
  <path d="M 566 336 L 577 392 L 615 356 L 590 400 L 642 400 L 590 412 L 627 452 L 580 420
           L 566 478 L 552 420 L 505 452 L 542 412 L 490 400 L 542 400 L 517 356 L 555 392 Z"
        fill="#ffe6c4"/>
  <circle cx="566" cy="406" r="14" fill="#ffffff"/>

  <!-- P bowl (ring) on the upper stem, framing the glow -->
  <g filter="url(#glow)">
   <ellipse cx="566" cy="406" rx="120" ry="100" fill="none" stroke="url(#swirl)" stroke-width="54"/>
  </g>
  <!-- re-cap the stem edge so the bowl reads as joined to the stem -->
  <rect x="402" y="318" width="62" height="200" rx="31" fill="url(#swirl)"/>

  <!-- code brackets  < … > -->
  <path d="M 330 350 L 224 512 L 330 674" fill="none" stroke="url(#brk)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 742 350 L 848 512 L 742 674" fill="none" stroke="url(#brk)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</svg>
